# This is a MINIMIZED set of options, required to ensure you don't break xiolot in a container, plus 2 extra bits of options kept for documentation. Please see https://codeberg.org/fmctf/xiolot#configuring for a complete list of available config options.

#Do NOT touch this! (unless you're manually migrating config versions)
configVersion: 3
#Do NOT touch this, EVER!!! (Changing this allows xiolot to auto-update, which in a containerized environment will lead to xiolot spontaneously downgrading back to the image's version whenever the container recreates. Version downgrades are not officially supported and can lead to anything from instability to config/DB corruption, and as such should NOT be done spontaneously with no backups!)
disableUpdating: true
#If you do decide to pass a session secret (xiolot works just fine with it unset), it's best practice to use a secret file if you're using Compose. Otherwise, feel free to remove this.
sessionSecretPath: null

#You can change your data directory and/or separate the key dir from the one with the DB, or do anything else to them, if you want to (put them next to this config, for what I care). Just double-check that you actually mounted those dirs on the host, otherwise you'll lose data whenever the container recreates!
dbPath: "/opt/xiolot/data/xiolot.db"
privateKeyPath: "/opt/xiolot/data/private.pem"
publicKeyPath: "/opt/xiolot/data/public.pem"
sessionKeyPath: "/opt/xiolot/data/session.key"

#Just like with sessionSecretPath, this is mostly for documentation's sake - if you're not planning to use OIDC, feel free to remove this whole block.
oidc:
  #If you set this to true, make sure that the secret specified below is actually being passed
  enable: true
  #You can of course rename the secret
  clientSecretPath: "/run/secrets/xiolot_key"
  # custom
  name: "GuzioHub Account"
  issuer: "https://sso.account.guziohub.ovh/"
  allowPasswordLogin: true
  maxProfiles: 10

# custom
baseUrl: "https://mc.guziohub.ovh/"
domain: "guziohub.ovh"
registrationMode: "invite"