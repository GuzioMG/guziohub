# Drasl default config file

# Example: drasl.example.com
Domain = "mc.guziohub.ovh"

# Example: https://drasl.example.com
BaseURL = "https://mc.guziohub.ovh"

# List of usernames who automatically become admins of the Drasl instance
DefaultAdmins = ["Guzio", "Guzio..mc.guziohub.ovh", "Lena..mc.guziohub.ovh"]
MaxPlayerNameLength = 50 #  16 (vanilla name limit) + 2 (.. delimiter) + 32 (domain name length limit for MC federation (enforced by skin encoding; may be extended in the future, and just we don't allow those longer servers to have Mojang players, or maybe we add an extra line on the skin, or maybe use more efficient encoding (technically, we can squeeze an extra ASCII char into a single row of 8 8-bits), etc.))


## FROM MOJANG RECIPE

SignPublicKeys = false
AllowChangingPlayerName = true #...except this - this needs to exist so I can ..mc.guziohub.ovh myself

[RegistrationUsernamePassword.CreateNewPlayer]
  Allow = false

[[FallbackAPIServers]]
  Nickname = "Mojang"
  DiscoveryMinecraftClientURL = "https://discovery.minecraftservices.com/minecraft/client"
  EnableAuthentication = true
  ForwardSkins = true
  SetSkinURL = "https://www.minecraft.net/msaprofile/mygames/editskin"

[[RegistrationUsernamePassword.ImportExistingPlayer]]
  FallbackAPIServerNickname = "Mojang"
  RequireSkinVerification = true